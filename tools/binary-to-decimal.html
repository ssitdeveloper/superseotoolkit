<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert binary numbers to decimal format instantly.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:"#07090f",cobalt:"#0a66ff"},boxShadow:{glow:"0 22px 70px rgba(10,102,255,0.28)"},fontFamily:{display:["Sora","ui-sans-serif","system-ui"]}}}}}</script>  <title>Binary to Decimal Converter | SuperSEOToolkit</title>
</head>
<body>
  <header class="sticky top-0 z-50 border-b border-white/10 bg-ink/70 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-10">
      <a href="/" class="font-display text-xl font-bold tracking-tight text-white">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-cobalt/90 text-sm text-white">S</span>
        <span class="ml-2">SuperSEOToolkit</span>
      </a>
      <nav class="hidden items-center gap-8 text-sm font-semibold text-white/75 md:flex">
        <a href="/tools/" class="transition hover:text-white">Tools</a>
        <a href="/#workflow" class="transition hover:text-white">Workflow</a>
        <a href="/blog/" class="transition hover:text-white">Blog</a>
      </nav>
      <div class="flex items-center gap-3">
        <a href="/about.html" class="hidden rounded-full border border-white/20 px-4 py-2 text-sm font-semibold text-white/80 transition hover:border-white/40 hover:text-white md:inline-flex">About</a>
        <a href="/tools/" class="hidden rounded-full bg-cobalt px-5 py-2 text-sm font-bold text-white shadow-glow transition hover:-translate-y-0.5 hover:bg-blue-500 md:inline-flex">Browse Tools</a>
        <button id="mobile-menu-btn" class="flex h-9 w-9 items-center justify-center rounded-lg border border-white/20 text-white md:hidden" aria-label="Toggle menu">
          <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg id="close-icon" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden border-t border-white/10 bg-ink/90 px-6 py-4 md:hidden">
      <nav class="flex flex-col gap-3 text-sm font-semibold text-white/80">
        <a href="/tools/" class="transition hover:text-white">Tools</a>
        <a href="/#workflow" class="transition hover:text-white">Workflow</a>
        <a href="/blog/" class="transition hover:text-white">Blog</a>
        <a href="/about.html" class="transition hover:text-white">About</a>
        <a href="/tools/" class="mt-2 inline-block rounded-full bg-cobalt px-5 py-2 text-center text-sm font-bold text-white">Browse Tools</a>
      </nav>
    </div>
  </header>
  <script>(function(){var b=document.getElementById('mobile-menu-btn'),m=document.getElementById('mobile-menu'),mi=document.getElementById('menu-icon'),ci=document.getElementById('close-icon');b.addEventListener('click',function(){var h=m.classList.toggle('hidden');mi.classList.toggle('hidden',!h);ci.classList.toggle('hidden',h);});})();</script>

  <section class="hero" style="padding: 3rem 0;">
    <div class="container">
      <div class="breadcrumb">
        <a href="/">Home</a> <span>/</span> <a href="/#tools">Tools</a> <span>/</span> <span>Binary to Decimal</span>
      </div>
      <h1>Binary to Decimal Converter</h1>
      <p>Convert binary numbers to decimal format instantly</p>
    </div>
  </section>

  <section style="padding: 3rem 0;">
    <div class="container container-sm">
      <div class="tool-interface">
        <div class="input-section">
          <h3>Binary Number</h3>
          <div class="form-group">
            <input type="text" id="binary-input" placeholder="Enter binary number (e.g., 11111111)" value="11111111">
          </div>
        </div>

        <div class="output-section">
          <h3>Decimal Result</h3>
          <div class="form-group" style="position: relative;">
            <textarea id="decimal-output" readonly placeholder="Decimal result will appear here..."></textarea>
            <button class="copy-btn" onclick="copyToClipboard('decimal-output')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Copy
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const binaryInput = document.getElementById('binary-input');
    const decimalOutput = document.getElementById('decimal-output');

    function convertBinaryToDecimal() {
      const binary = binaryInput.value.trim();
      if (!binary || !/^[01]+$/.test(binary)) {
        decimalOutput.value = '';
        return;
      }
      decimalOutput.value = parseInt(binary, 2).toString();
    }

    binaryInput.addEventListener('input', convertBinaryToDecimal);
    convertBinaryToDecimal();
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
