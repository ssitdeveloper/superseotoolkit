<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>Email Validator | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar"><a href="/" class="logo">SuperSEOToolkit</a></nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container"><h1>Email Validator</h1></div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="text" id="email" placeholder="test@example.com">
      </div>
      <div id="result" style="padding: 1rem; border-radius: 0.5rem; text-align: center; margin-top: 1rem; display: none;">
        <p id="message"></p>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const email = document.getElementById('email');
    const result = document.getElementById('result');
    const message = document.getElementById('message');

    email.addEventListener('input', () => {
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const valid = regex.test(email.value);
      result.style.display = email.value ? 'block' : 'none';
      if (valid) {
        result.style.background = 'rgba(16, 185, 129, 0.1)';
        result.style.color = '#10b981';
        message.textContent = 'âœ“ Valid Email Address';
      } else {
        result.style.background = 'rgba(239, 68, 68, 0.1)';
        result.style.color = '#ef4444';
        message.textContent = 'âœ— Invalid Email Address';
      }
    });
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
