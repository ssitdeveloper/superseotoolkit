<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>Decimal to Hex | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar"><a href="/" class="logo">SuperSEOToolkit</a></nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container">
      <h1>Decimal to Hex Converter</h1>
    </div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div class="tool-interface">
        <div class="input-section">
          <h3>Decimal</h3>
          <input type="number" id="decimal" placeholder="255" value="255">
        </div>
        <div class="output-section">
          <h3>Hexadecimal</h3>
          <input type="text" id="hex" readonly>
          <button class="copy-btn" onclick="copyToClipboard('hex')">Copy</button>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const decimal = document.getElementById('decimal');
    const hex = document.getElementById('hex');
    decimal.addEventListener('input', () => {
      const d = parseInt(decimal.value, 10);
      hex.value = d >= 0 ? d.toString(16).toUpperCase() : '';
    });
    decimal.dispatchEvent(new Event('input'));
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
