<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minify HTML code by removing unnecessary whitespace and comments.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>HTML Minifier | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar">
        <a href="/" class="logo">SuperSEOToolkit</a>
        <nav><ul><li><a href="/#tools">Tools</a></li><li><a href="/blog/">Blog</a></li><li><a href="/about.html">About</a></li><li><a href="/contact.html">Contact</a></li></ul></nav>
        <div class="nav-controls">
          <button id="theme-toggle" class="theme-toggle">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero" style="padding: 3rem 0;">
    <div class="container">
      <h1>HTML Minifier</h1>
      <p>Remove whitespace and comments from HTML code</p>
    </div>
  </section>

  <section style="padding: 3rem 0;">
    <div class="container container-sm">
      <div class="tool-interface">
        <div class="input-section">
          <h3>HTML Code</h3>
          <textarea id="html-input" placeholder="Paste your HTML code here..."></textarea>
        </div>
        <div class="output-section">
          <h3>Minified HTML</h3>
          <textarea id="html-output" readonly></textarea>
          <button class="copy-btn" onclick="copyToClipboard('html-output')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Copy
          </button>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const htmlInput = document.getElementById('html-input');
    const htmlOutput = document.getElementById('html-output');

    function minifyHTML() {
      let html = htmlInput.value;
      html = html.replace(/<!--[\s\S]*?-->/g, '');
      html = html.replace(/\s+/g, ' ');
      html = html.replace(/>\s</g, '><');
      htmlOutput.value = html.trim();
    }

    htmlInput.addEventListener('input', minifyHTML);
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
