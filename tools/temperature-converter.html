<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>Temperature Converter | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar">
        <a href="/" class="logo">SuperSEOToolkit</a>
        <nav><ul><li><a href="/#tools">Tools</a></li></ul></nav>
        <div class="nav-controls"><button id="theme-toggle" class="theme-toggle"><svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg><svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79"/></svg></button></div>
      </nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container">
      <h1>Temperature Converter</h1>
      <p>Convert between Celsius, Fahrenheit & Kelvin</p>
    </div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
        <div class="form-group">
          <label>Celsius (Â°C)</label>
          <input type="number" id="celsius" placeholder="0">
        </div>
        <div class="form-group">
          <label>Fahrenheit (Â°F)</label>
          <input type="number" id="fahrenheit" placeholder="32">
        </div>
        <div class="form-group">
          <label>Kelvin (K)</label>
          <input type="number" id="kelvin" placeholder="273.15">
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const celsius = document.getElementById('celsius');
    const fahrenheit = document.getElementById('fahrenheit');
    const kelvin = document.getElementById('kelvin');

    celsius.addEventListener('input', () => {
      const c = parseFloat(celsius.value);
      if (!isNaN(c)) {
        fahrenheit.value = (c * 9/5 + 32).toFixed(2);
        kelvin.value = (c + 273.15).toFixed(2);
      }
    });

    fahrenheit.addEventListener('input', () => {
      const f = parseFloat(fahrenheit.value);
      if (!isNaN(f)) {
        celsius.value = ((f - 32) * 5/9).toFixed(2);
        kelvin.value = ((f - 32) * 5/9 + 273.15).toFixed(2);
      }
    });

    kelvin.addEventListener('input', () => {
      const k = parseFloat(kelvin.value);
      if (!isNaN(k)) {
        celsius.value = (k - 273.15).toFixed(2);
        fahrenheit.value = ((k - 273.15) * 9/5 + 32).toFixed(2);
      }
    });
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
