<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>Remove Duplicates | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar"><a href="/" class="logo">SuperSEOToolkit</a></nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container"><h1>Remove Duplicates</h1></div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div class="tool-interface">
        <div class="input-section"><h3>Input</h3><textarea id="input" placeholder="One item per line..."></textarea></div>
        <div class="output-section"><h3>Unique Items</h3><textarea id="output" readonly></textarea><button class="copy-btn" onclick="copyToClipboard('output')">Copy</button></div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    input.addEventListener('input', () => {
      const lines = input.value.split('\n');
      const unique = [...new Set(lines.filter(x => x.trim()))];
      output.value = unique.join('\n');
    });
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
