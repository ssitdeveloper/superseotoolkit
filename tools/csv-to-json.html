<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>CSV to JSON | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar"><a href="/" class="logo">SuperSEOToolkit</a></nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container"><h1>CSV to JSON Converter</h1></div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div class="tool-interface">
        <div class="input-section"><h3>CSV</h3><textarea id="input" placeholder="name,age\nJohn,30"></textarea></div>
        <div class="output-section"><h3>JSON</h3><textarea id="output" readonly></textarea><button class="copy-btn" onclick="copyToClipboard('output')">Copy</button></div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');

    input.addEventListener('input', () => {
      const lines = input.value.trim().split('\n');
      if (lines.length < 2) return;
      const headers = lines[0].split(',');
      const json = lines.slice(1).map(line => {
        const values = line.split(',');
        return Object.fromEntries(headers.map((h, i) => [h, values[i]]));
      });
      output.value = JSON.stringify(json, null, 2);
    });
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
