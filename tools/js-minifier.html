<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>JavaScript Minifier | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar">
        <a href="/" class="logo">SuperSEOToolkit</a>
        <nav><ul><li><a href="/#tools">Tools</a></li></ul></nav>
        <div class="nav-controls"><button id="theme-toggle" class="theme-toggle"><svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg><svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></div>
      </nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container">
      <h1>JavaScript Minifier</h1>
      <p>Compress JavaScript code</p>
    </div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div class="tool-interface">
        <div class="input-section">
          <h3>JavaScript</h3>
          <textarea id="input" placeholder="Paste JS..."></textarea>
        </div>
        <div class="output-section">
          <h3>Minified</h3>
          <textarea id="output" readonly></textarea>
          <button class="copy-btn" onclick="copyToClipboard('output')">Copy</button>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    input.addEventListener('input', () => {
      let js = input.value.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '').replace(/\s+/g, ' ');
      output.value = js.trim();
    });
  </script>
</body>
</html>
