<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <title>Caesar Cipher | SuperSEOToolkit</title>
</head>
<body>
  <header>
    <div class="container">
      <nav class="navbar"><a href="/" class="logo">SuperSEOToolkit</a></nav>
    </div>
  </header>

  <section class="hero" style="padding: 2rem 0;">
    <div class="container"><h1>Caesar Cipher</h1></div>
  </section>

  <section style="padding: 2rem 0;">
    <div class="container container-sm">
      <div class="form-group">
        <label>Shift (1-25)</label>
        <input type="number" id="shift" value="3" min="1" max="25">
      </div>
      <div class="tool-interface">
        <div class="input-section"><h3>Text</h3><textarea id="input"></textarea></div>
        <div class="output-section"><h3>Encrypted</h3><textarea id="output" readonly></textarea><button class="copy-btn" onclick="copyToClipboard('output')">Copy</button></div>
      </div>
    </div>
  </section>

  <script src="/assets/js/main.js"></script>
  <script>
    const input = document.getElementById('input');
    const shift = document.getElementById('shift');
    const output = document.getElementById('output');

    function encrypt() {
      const s = parseInt(shift.value, 10);
      output.value = input.value.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + s) ? c : c - 26));
    }

    input.addEventListener('input', encrypt);
    shift.addEventListener('input', encrypt);
  </script>
  <script src="/assets/js/premium-system.js"></script>
</body>
</html>
